name: ai-live-emotions-decode

# Общие значения для Python-сервисов. Адреса — внутри сети compose (rabbitmq, minio),
# логины и пароли — те же переменные, что у самих контейнеров RabbitMQ и MinIO.
x-rabbit-url: &rabbit-url amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
x-s3-endpoint: &s3-endpoint http://minio:9000
x-s3-access-key: &s3-access-key ${MINIO_ROOT_USER:-minioadmin}
x-s3-secret-key: &s3-secret-key ${MINIO_ROOT_PASSWORD:-minioadmin}
x-s3-bucket: &s3-bucket ${MINIO_BUCKET:-frames}

x-app: &app
  restart: unless-stopped
  depends_on:
    rabbitmq:
      condition: service_healthy
    minio:
      condition: service_healthy

# Пока данные хранятся в tmpfs (в RAM) с ограничением размера: на диск ничего не пишется,
# а при удалении или перезапуске контейнера всё стирается.

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-emotions}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Официальные образы minio/minio удалены из Docker Hub (октябрь 2025),
  # поэтому используем замороженную сборку Bitnami. При старте она создаёт MINIO_DEFAULT_BUCKETS.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-frames}
    ports:
      - "${MINIO_API_PORT:-9000}:9000" # S3 API
    tmpfs:
      - /bitnami/minio/data:size=2g
      - /certs:size=1m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # В сборке MinIO от Bitnami нет встроенной веб-консоли, она поставляется отдельно.
  minio-console:
    image: bitnamilegacy/minio-object-browser:2.0.2-debian-12-r4
    container_name: minio-console
    restart: unless-stopped
    command: server
    environment:
      CONSOLE_MINIO_SERVER: http://minio:9000
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9090"
    depends_on:
      minio:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"             # AMQP
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672" # Веб-интерфейс управления
    tmpfs:
      - /var/lib/rabbitmq:size=512m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------- Python-сервисы (Dockerfile в корне, один на всех) ----------
  # Локальный запуск без Docker (tools/project.py start) поднимает только инфраструктуру выше;
  # не запускайте оба варианта одновременно — они делят очереди и порт 8000.

  backend:
    <<: *app
    build:
      context: .
      target: app
      args: { PACKAGE: backend }
    image: ai-live-emotions-decode/backend
    container_name: backend
    environment:
      BACKEND_RABBIT__URL: *rabbit-url
      BACKEND_S3__ENDPOINT_URL: *s3-endpoint
      BACKEND_S3__ACCESS_KEY: *s3-access-key
      BACKEND_S3__SECRET_KEY: *s3-secret-key
      BACKEND_S3__BUCKET: *s3-bucket
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  cv-service:
    <<: *app
    build:
      context: .
      target: app
      args: { PACKAGE: cv-service }
    image: ai-live-emotions-decode/cv-service
    container_name: cv-service
    environment:
      CV_RABBIT__URL: *rabbit-url
      CV_S3__ENDPOINT_URL: *s3-endpoint
      CV_S3__ACCESS_KEY: *s3-access-key
      CV_S3__SECRET_KEY: *s3-secret-key
      CV_S3__BUCKET: *s3-bucket
      # Режим кропа должен совпадать с crop модели ai-service (см. docs/models.md).
      CV_FACE_CROP: ${CV_FACE_CROP:-yunet5_similarity_v1}
      CV_SAVE_CROPS: ${CV_SAVE_CROPS:-true}

  ai-service:
    <<: *app
    build:
      context: .
      target: ai-service
      args: { PACKAGE: ai-service }
    image: ai-live-emotions-decode/ai-service
    container_name: ai-service
    environment:
      AI_RABBIT__URL: *rabbit-url
      AI_S3__ENDPOINT_URL: *s3-endpoint
      AI_S3__ACCESS_KEY: *s3-access-key
      AI_S3__SECRET_KEY: *s3-secret-key
      AI_S3__BUCKET: *s3-bucket
      AI_EMOTION_MODEL: ${AI_EMOTION_MODEL:-reliable}
      AI_RELIABILITY_PATH: ${AI_RELIABILITY_PATH:-models/emotion_reliable}
      AI_EMOTION_MODEL_PATH: ${AI_EMOTION_MODEL_PATH:-models/emotion_experiment/model.onnx}

  notification-service:
    <<: *app
    build:
      context: .
      target: app
      args: { PACKAGE: notification-service }
    image: ai-live-emotions-decode/notification-service
    container_name: notification-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      NOTIFY_RABBIT__URL: *rabbit-url
