# Виртуальный корень workspace: своего пакета нет, он только объединяет сервисы и общие
# библиотеки под одним uv.lock и одним .venv.
[tool.uv.workspace]
members = [
    "libs/common",
    "backend",
    "cv-service",
    "ai-service",
    "notification-service",
]

[dependency-groups]
training = [
    "torch==2.15.0", "torchvision", "timm", "pandas", "scikit-learn",
    "matplotlib", "scipy", "tqdm", "onnx", "onnxruntime", "onnxscript",
    "ipykernel", "pillow", "nbformat",
]

dev = [
    "basedpyright>=1.40.2",
    "boto3-stubs-lite[s3]>=1.43.115",
]

# [tool.pyright], а не [tool.basedpyright]: эту секцию читают и basedpyright, и Pylance в IDE.
[tool.pyright]
venvPath = "."
venv = ".venv"
include = [
    "libs/common/src",
    "backend/src",
    "cv-service/src",
    "ai-service/src",
    "notification-service/src",
]
# Пакеты workspace стоят в .venv как editable (.pth), IDE их не всегда подхватывает,
# поэтому исходники всех пакетов явно добавлены в пути поиска импортов.
extraPaths = [
    "libs/common/src",
    "backend/src",
    "cv-service/src",
    "ai-service/src",
    "notification-service/src",
]
